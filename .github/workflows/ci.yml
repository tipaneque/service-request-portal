name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows the pipeline to be re-run by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the run that is already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Current LTS plus the next line, so an upcoming Node release cannot
        # break the build unnoticed.
        node-version: [20.x, 22.x]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            keycloak-theme/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins - reproducible
        # and faster than `npm install`.
        run: npm ci

      - name: Install Keycloak theme dependencies
        run: npm ci --prefix keycloak-theme

      - name: Verify the API types still match the OpenAPI document
        # Guards against a contract change that was never regenerated: the
        # committed types must equal what the spec produces today.
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Keycloak theme
        run: npm run theme:lint && npm run theme:typecheck

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build
        env:
          # The artifact exercises the secure production branch. A real
          # deployment must replace these values with its registered provider.
          VITE_AUTH_MODE: oidc
          VITE_ENABLE_API_MOCKS: "false"
          VITE_OIDC_AUTHORITY: https://identity.example.test
          VITE_OIDC_CLIENT_ID: service-request-portal-ci

      - name: Upload production build
        # Only one copy is needed; the Node version does not change the output.
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Set up Java for the Keycloak theme
        if: matrix.node-version == '22.x'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Keycloak theme JARs
        if: matrix.node-version == '22.x'
        run: npm run theme:build

      - name: Upload Keycloak theme JARs
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-theme
          path: keycloak-theme/dist_keycloak/*.jar
          retention-days: 7
